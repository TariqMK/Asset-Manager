  <rect x="160" y="160" width="320" height="320" rx="48" fill="#46464b"/>
  <rect x="544" y="160" width="320" height="320" rx="48" fill="#46464b"/>
  <rect x="160" y="544" width="320" height="320" rx="48" fill="#46464b"/>
  <rect x="544" y="544" width="320" height="320" rx="48" fill="#46464b"/>
  <g transform="rotate(-20 512 512)">
    <path d="M380 280 h190 l140 140 v280 a40 40 0 0 1 -40 40 h-290 a40 40 0 0 1 -40 -40 v-380 a40 40 0 0 1 40 -40z"
          fill="none" stroke="#19191b" stroke-width="56" stroke-linejoin="round"/>
