name: Release

# Manual trigger only: Actions tab -> Release -> Run workflow.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Draft or public release?"
        type: choice
        required: true
        default: draft
        options:
          - draft
          - public
      bump:
        description: "Version bump (major / minor / patch)"
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

# Two runs at once could both claim the same version number.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Work out next version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: next
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # Draft releases have no git tag until published, so look at the
          # release list (which includes drafts) as well as the tags.
          {
            git tag --list 'v*'
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" --jq '.[].tag_name'
          } | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -uV > versions.txt || true

          latest=$(tail -n 1 versions.txt)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"

          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          version="${major}.${minor}.${patch}"
          echo "Latest: ${latest} -> next: v${version} (${BUMP})"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.label }})
    needs: version
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
          - os: macos-latest # Apple Silicon (arm64) runner
            label: macos-arm64
          - os: ubuntu-latest
            label: linux-x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ASSET: AssetManager-${{ needs.version.outputs.tag }}-${{ matrix.label }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libnss3 libfontconfig1 libdbus-1-3

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          # pywebview has no built-in backend on Linux; bundle Qt.
          if [ "$RUNNER_OS" = "Linux" ]; then
            pip install "pywebview[qt]"
          fi

      # build.py stamps $VERSION into the app (window title + sidebar)
      - name: Build
        run: python build.py

      - name: Package
        run: |
          mkdir -p out
          case "$RUNNER_OS" in
            Windows) (cd dist && 7z a -tzip "../out/${ASSET}.zip" AssetManager) ;;
            macOS)   ditto -c -k --keepParent dist/AssetManager.app "out/${ASSET}.zip" ;;
            Linux)   tar -C dist -czf "out/${ASSET}.tar.gz" AssetManager ;;
          esac
          ls -lh out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET }}
          path: out/*
          if-no-files-found: error

  release:
    name: Tag and publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ needs.version.outputs.tag }}
      RELEASE_TYPE: ${{ inputs.release_type }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create tag
        run: |
          # Tag drafts too, so the version is reserved even before publishing.
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      - name: Create release
        run: |
          flags=(--verify-tag --title "Asset Manager $TAG" --generate-notes)
          if [ "$RELEASE_TYPE" = "draft" ]; then
            flags+=(--draft)
          else
            flags+=(--latest)
          fi
          gh release create "$TAG" out/* "${flags[@]}"
